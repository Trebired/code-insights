[package]
name = "code-insights"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "code-insights"
path = "src/main.rs"

[dependencies]
globset = "0.4"
hyperpolyglot = { path = "../vendor/hyperpolyglot" }
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[profile.release]
codegen-units = 1
lto = true
strip = true
