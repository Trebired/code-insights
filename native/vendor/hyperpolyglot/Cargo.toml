# Vendored from hyperpolyglot 0.1.7 (https://github.com/monkslc/hyperpolyglot), MIT OR Apache-2.0.
# Changes: the detectors and filters modules are public so callers can detect a language from
# in-memory content, and the command-line binary with its dependencies is removed.

[package]
edition = "2018"
name = "hyperpolyglot"
version = "0.1.7"
authors = ["Connor Monks <monkslc@gmail.com>"]
description = "A fast programming language detector"
license = "MIT OR Apache-2.0"
repository = "https://github.com/monkslc/hyperpolyglot"
publish = false

[lib]
doctest = false
test = false

[dependencies]
ignore = "0.4.1"
lazy_static = "1.4.0"
num_cpus = "1.13.0"
pcre2 = "0.2.3"
phf = "0.8"
polyglot_tokenizer = "0.2.1"
regex = "1.3.5"
